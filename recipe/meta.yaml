{% set name = "bc-python-hcl2" %}
{% set version = "0.4.5" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 62a2cab872757c0183fd92270c5ea013820c197de889a195ab107148406c8e27

build:
  script: {{ PYTHON }} -m pip install . -vv
  number: 0
  noarch: python

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - lark >=1.0.0

test:
  imports:
    - hcl2
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/bridgecrewio/python-hcl2
  summary: A parser for HCL2
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - borchero
    - nick-harmening
